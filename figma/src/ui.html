<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Figma's own theme colours (themeColors: true), so the panel sits in Figma like its own panels do. */
  * { box-sizing: border-box; }
  body { margin: 0; font: 11px/16px Inter, system-ui, sans-serif; color: var(--figma-color-text); background: var(--figma-color-bg); }
  header { position: sticky; top: 0; z-index: 1; display: flex; gap: 8px; padding: 12px; background: var(--figma-color-bg); border-bottom: 1px solid var(--figma-color-border); }
  input, select { font: inherit; color: inherit; background: var(--figma-color-bg-secondary); border: 1px solid var(--figma-color-border); border-radius: 5px; height: 28px; padding: 0 8px; }
  input { flex: 1; min-width: 0; }
  input:focus, select:focus { outline: none; border-color: var(--figma-color-border-selected); }
  h2 { font-size: 11px; font-weight: 500; margin: 0; padding: 12px 12px 6px; color: var(--figma-color-text-secondary); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 2px; padding: 0 8px; }
  button { all: unset; display: grid; place-items: center; height: 44px; border-radius: 5px; cursor: pointer; }
  button:hover, button:focus-visible { background: var(--figma-color-bg-hover); }
  button svg { width: 28px; height: auto; shape-rendering: crispEdges; }
  .empty { padding: 24px 12px; color: var(--figma-color-text-secondary); }
  footer { padding: 12px; color: var(--figma-color-text-tertiary); }
</style>
</head>
<body>
<header>
  <input id="q" type="search" placeholder="Search icons" autofocus>
  <select id="size" title="Size">
    <option value="1">7 px</option>
    <option value="2">14 px</option>
    <option value="3" selected>21 px</option>
    <option value="4">28 px</option>
    <option value="6">42 px</option>
    <option value="8">56 px</option>
  </select>
</header>
<main id="list"></main>
<footer>Click to insert into the selected frame, or at the centre of the view.</footer>
<!-- ui.js -->
</body>
</html>
